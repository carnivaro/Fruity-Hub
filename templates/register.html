{% extends 'base.html' %}
{% block title %}Create Account | Fruity Hub{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card auth-card-wide"><div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div><span class="eyebrow">Join Fruity Hub</span><h1>Create your account</h1><p>Register once and make ordering fresh fruits easier.</p><form method="post">{% csrf_token %}<label>First name<input type="text" name="first_name" required></label><label>Last name<input type="text" name="last_name" required></label><label>Username<input type="text" name="username" required></label><label>Email address<input type="email" name="email" required></label><label>Password<input type="password" name="password" required minlength="8"><small class="field-hint">At least 8 characters, with an uppercase letter, a lowercase letter, a number, and a special character.</small></label><label>Confirm password<input type="password" name="confirm_password" required></label><button class="btn btn-primary wide-btn" type="submit">Create Account</button></form><p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p></div></section>
{% endblock %}
