{% extends 'base.html' %}
{% block title %}Login | Fruity Hub{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card"><div class="auth-icon"><i class="fa-solid fa-leaf"></i></div><span class="eyebrow">Welcome back</span><h1>Login to Fruity Hub</h1><p>Access your account and continue shopping fresh fruits.</p><form method="post">{% csrf_token %}<label>Username<input type="text" name="username" required autocomplete="off"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-primary wide-btn" type="submit">Login</button></form><p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Create one</a></p></div></section>
{% endblock %}
